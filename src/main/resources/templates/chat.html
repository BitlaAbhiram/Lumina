<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina AI</title>
    <link rel="stylesheet" href="/css/style.css" />
    <!-- marked.js for markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- highlight.js for code block syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<!-- ── SIDEBAR ─────────────────────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo">
            <span class="logo-icon">✦</span>
            <span class="logo-text">Lumina</span>
        </div>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
    </button>

    <div class="sidebar-section-label">Suggestions</div>

    <div class="suggestions-list">
        <button class="suggestion-item" onclick="fillInput('Explain quantum computing in simple terms')">
            <span class="suggestion-icon">⚛</span>
            Quantum computing basics
        </button>
        <button class="suggestion-item" onclick="fillInput('Write a Python function to reverse a string')">
            <span class="suggestion-icon">🐍</span>
            Python string reversal
        </button>
        <button class="suggestion-item" onclick="fillInput('What are the best practices for REST API design?')">
            <span class="suggestion-icon">🔌</span>
            REST API best practices
        </button>
        <button class="suggestion-item" onclick="fillInput('Give me a healthy 7-day meal plan')">
            <span class="suggestion-icon">🥗</span>
            Weekly meal plan
        </button>
        <button class="suggestion-item" onclick="fillInput('Explain how neural networks learn')">
            <span class="suggestion-icon">🧠</span>
            How neural networks learn
        </button>
        <button class="suggestion-item" onclick="fillInput('Write a cover letter for a software engineer role')">
            <span class="suggestion-icon">📄</span>
            Software engineer cover letter
        </button>
    </div>

    <div class="sidebar-footer">
        <div class="model-badge">
            <span class="model-dot"></span>
            Gemini 2.0 Flash
        </div>
    </div>
</aside>

<!-- ── MAIN CHAT AREA ─────────────────────────────────────────────────── -->
<main class="main-area">

    <!-- Top bar -->
    <header class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-title">
            <span class="topbar-logo-icon">✦</span>
            Lumina
        </div>
        <div class="topbar-actions">
            <button class="icon-btn" id="themeToggle" title="Toggle theme">
                <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
        </div>
    </header>

    <!-- Messages -->
    <div class="chat-area" id="chatArea">
        <!-- Welcome screen (shown before first message) -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-icon">✦</div>
            <h1 class="welcome-title">Hello, I'm Lumina</h1>
            <p class="welcome-subtitle">Your AI-powered assistant. Ask me anything — I'm here to help.</p>
            <div class="welcome-chips">
                <button class="chip" onclick="fillInput('What can you help me with?')">✨ What can you do?</button>
                <button class="chip" onclick="fillInput('Explain machine learning to a beginner')">🤖 Machine learning basics</button>
                <button class="chip" onclick="fillInput('Help me debug my Java code')">☕ Debug Java code</button>
                <button class="chip" onclick="fillInput('Write a creative short story')">📖 Write a story</button>
            </div>
        </div>

        <!-- Messages container -->
        <div id="messages"></div>
    </div>

    <!-- Input area -->
    <div class="input-wrapper">
        <div class="input-container" id="inputContainer">
            <textarea
                id="userInput"
                class="input-field"
                placeholder="Message Lumina..."
                rows="1"
                maxlength="4000"
            ></textarea>
            <div class="input-actions">
                <span class="char-count" id="charCount">0 / 4000</span>
                <button class="send-btn" id="sendBtn" title="Send message" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>
        <p class="input-disclaimer">Lumina can make mistakes. Consider checking important information.</p>
    </div>

</main>

<script src="/js/script.js"></script>
</body>
</html>
